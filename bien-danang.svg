<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="danangTitle">
  <title id="danangTitle">Minh họa bãi biển Đà Nẵng, cầu Rồng, người tắm biển và dừa biển</title>
  <defs>
    <linearGradient id="dnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9DAD2"/>
      <stop offset="100%" stop-color="#F7F1E4"/>
    </linearGradient>
    <linearGradient id="dnSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E8577"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <radialGradient id="sunGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3A8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE3A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="340" fill="url(#dnSky)"/>

  <!-- sun -->
  <circle cx="400" cy="70" r="55" fill="url(#sunGlow2)"/>
  <circle cx="400" cy="70" r="26" fill="#F0B94A" opacity="0.9"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.8">
    <ellipse cx="70" cy="55" rx="26" ry="10"/>
    <ellipse cx="95" cy="48" rx="18" ry="8"/>
  </g>

  <!-- birds -->
  <g stroke="#1B2A4A" stroke-width="2" fill="none" opacity="0.6">
    <path d="M260 60 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- mountain (Son Tra) -->
  <polygon points="0,190 90,110 180,190" fill="#2F5D50" opacity="0.65"/>
  <polygon points="0,190 90,110 180,190" fill="#3E8577" opacity="0.25"/>

  <!-- sea with dynamic waves -->
  <rect x="0" y="180" width="480" height="90" fill="url(#dnSea)"/>
  <g stroke="#F7F1E4" stroke-width="2.5" opacity="0.6">
    <path d="M10 200 q20 10 40 0 t40 0 t40 0 t40 0" fill="none"/>
    <path d="M250 218 q20 10 40 0 t40 0 t40 0" fill="none"/>
    <path d="M100 240 q20 10 40 0 t40 0 t40 0" fill="none"/>
  </g>
  <!-- surfer riding a wave -->
  <g>
    <path d="M340 235 q20 -14 45 -4" stroke="#F7F1E4" stroke-width="3" fill="none" opacity="0.7"/>
    <circle cx="365" cy="228" r="5" fill="#1B2A4A"/>
    <rect x="360" y="232" width="10" height="3" rx="1.5" fill="#7A2E2E"/>
  </g>

  <!-- dragon bridge silhouette -->
  <path d="M150 200 Q240 130 330 200" stroke="#7A2E2E" stroke-width="8" fill="none"/>
  <path d="M150 200 Q240 130 330 200" stroke="#F0B94A" stroke-width="2" fill="none"/>
  <g fill="#7A2E2E">
    <circle cx="170" cy="192" r="5"/>
    <circle cx="200" cy="165" r="5"/>
    <circle cx="240" cy="150" r="6"/>
    <circle cx="280" cy="165" r="5"/>
    <circle cx="310" cy="192" r="5"/>
  </g>

  <!-- sand -->
  <rect x="0" y="270" width="480" height="70" fill="#F5E6BE"/>

  <!-- coconut palm trees -->
  <g>
    <path d="M420 340 Q414 290 420 260" stroke="#8A5A2A" stroke-width="5" fill="none"/>
    <g fill="#2F5D50">
      <ellipse cx="420" cy="255" rx="26" ry="9" transform="rotate(-20 420 255)"/>
      <ellipse cx="420" cy="255" rx="26" ry="9" transform="rotate(20 420 255)"/>
      <ellipse cx="420" cy="255" rx="26" ry="9" transform="rotate(60 420 255)"/>
      <ellipse cx="420" cy="255" rx="26" ry="9" transform="rotate(-60 420 255)"/>
    </g>
  </g>

  <!-- beach umbrella + chairs -->
  <g transform="translate(70,255)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#7A2E2E" stroke-width="4"/>
    <path d="M-30 0 Q0 -35 30 0 Z" fill="#C4471F"/>
    <path d="M-30 0 Q0 -35 30 0" stroke="#F0B94A" stroke-width="2" fill="none"/>
    <rect x="-22" y="20" width="44" height="6" fill="#F0DDB2"/>
  </g>
  <g transform="translate(140,262)">
    <line x1="0" y1="0" x2="0" y2="38" stroke="#33456B" stroke-width="3"/>
    <path d="M-22 0 Q0 -28 22 0 Z" fill="#5B8DBF"/>
  </g>

  <!-- people playing in the sand and swimming -->
  <g fill="#1B2A4A">
    <circle cx="200" cy="300" r="7"/>
    <rect x="195" y="307" width="10" height="18" rx="3"/>
    <circle cx="230" cy="308" r="5"/>
    <rect x="226" y="313" width="8" height="12" rx="2"/>
  </g>
  <g fill="#7A2E2E" opacity="0.85">
    <circle cx="280" cy="255" r="6"/>
  </g>
  <g fill="#33456B" opacity="0.85">
    <circle cx="310" cy="260" r="5"/>
  </g>

  <!-- fishing boats -->
  <path d="M400 235 Q420 225 440 235 L432 244 L408 244 Z" fill="#1B2A4A"/>
  <line x1="420" y1="235" x2="420" y2="220" stroke="#1B2A4A" stroke-width="2"/>
</svg>
