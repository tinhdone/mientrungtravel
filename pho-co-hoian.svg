<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hoianTitle">
  <title id="hoianTitle">Minh họa phố cổ Hội An với dãy đèn lồng, người đi bộ và xe đạp</title>
  <defs>
    <linearGradient id="hoianSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE0A0"/>
      <stop offset="100%" stop-color="#F7F1E4"/>
    </linearGradient>
  </defs>
  <rect width="480" height="340" fill="url(#hoianSky)"/>

  <!-- soft clouds -->
  <g fill="#FFFDF8" opacity="0.7">
    <ellipse cx="60" cy="40" rx="24" ry="9"/>
    <ellipse cx="420" cy="30" rx="28" ry="10"/>
  </g>

  <!-- street -->
  <rect x="0" y="270" width="480" height="70" fill="#DCCBA6"/>
  <g stroke="#C9B58A" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="290" x2="480" y2="290"/>
    <line x1="0" y1="315" x2="480" y2="315"/>
  </g>

  <!-- buildings -->
  <g>
    <rect x="20" y="140" width="120" height="130" fill="#E2992F"/>
    <rect x="20" y="140" width="120" height="16" fill="#B8791F"/>
    <rect x="150" y="110" width="130" height="160" fill="#C4471F" opacity="0.92"/>
    <rect x="150" y="110" width="130" height="16" fill="#7A2E2E"/>
    <rect x="290" y="150" width="170" height="120" fill="#F0DDB2"/>
    <rect x="290" y="150" width="170" height="16" fill="#B8791F"/>
  </g>

  <!-- roof texture -->
  <g stroke="#7A2E2E" stroke-width="1" opacity="0.4">
    <line x1="20" y1="160" x2="140" y2="160"/>
    <line x1="150" y1="130" x2="280" y2="130"/>
    <line x1="290" y1="170" x2="460" y2="170"/>
  </g>

  <!-- windows/doors -->
  <g fill="#33456B">
    <rect x="40" y="200" width="24" height="34"/>
    <rect x="90" y="200" width="24" height="34"/>
    <rect x="175" y="180" width="26" height="70" fill="#1B2A4A"/>
    <rect x="225" y="190" width="26" height="36"/>
    <rect x="315" y="200" width="24" height="34"/>
    <rect x="365" y="200" width="24" height="34"/>
    <rect x="415" y="200" width="24" height="34"/>
  </g>

  <!-- flower pots along the balconies, a Hoi An signature -->
  <g>
    <rect x="36" y="234" width="32" height="8" fill="#7A2E2E"/>
    <circle cx="42" cy="230" r="5" fill="#C4471F"/>
    <circle cx="52" cy="228" r="5" fill="#E2992F"/>
    <circle cx="62" cy="230" r="5" fill="#C4471F"/>

    <rect x="311" y="234" width="32" height="8" fill="#7A2E2E"/>
    <circle cx="317" cy="230" r="5" fill="#E2992F"/>
    <circle cx="327" cy="228" r="5" fill="#C4471F"/>
    <circle cx="337" cy="230" r="5" fill="#E2992F"/>
  </g>

  <!-- lantern string across the street -->
  <path d="M0 90 Q 240 40 480 90" stroke="#4A3B2A" stroke-width="2" fill="none"/>
  <g>
    <g transform="translate(60,95)">
      <ellipse rx="16" ry="20" fill="#C4471F"/>
      <ellipse rx="16" ry="20" fill="none" stroke="#F0B94A" stroke-width="2"/>
    </g>
    <g transform="translate(140,72)">
      <ellipse rx="14" ry="18" fill="#F0B94A"/>
      <ellipse rx="14" ry="18" fill="none" stroke="#7A2E2E" stroke-width="2"/>
    </g>
    <g transform="translate(220,58)">
      <ellipse rx="16" ry="20" fill="#5B8DBF"/>
      <ellipse rx="16" ry="20" fill="none" stroke="#F0B94A" stroke-width="2"/>
    </g>
    <g transform="translate(300,63)">
      <ellipse rx="14" ry="18" fill="#E2992F"/>
      <ellipse rx="14" ry="18" fill="none" stroke="#7A2E2E" stroke-width="2"/>
    </g>
    <g transform="translate(380,80)">
      <ellipse rx="16" ry="20" fill="#C4471F"/>
      <ellipse rx="16" ry="20" fill="none" stroke="#F0B94A" stroke-width="2"/>
    </g>
    <g transform="translate(440,95)">
      <ellipse rx="14" ry="18" fill="#8BAE7A"/>
      <ellipse rx="14" ry="18" fill="none" stroke="#7A2E2E" stroke-width="2"/>
    </g>
  </g>

  <!-- people strolling -->
  <g fill="#1B2A4A">
    <circle cx="90" cy="285" r="7"/>
    <rect x="85" y="292" width="10" height="22" rx="3"/>
    <circle cx="410" cy="288" r="7"/>
    <rect x="405" y="295" width="10" height="20" rx="3"/>
  </g>
  <g fill="#7A2E2E">
    <circle cx="105" cy="288" r="6"/>
    <rect x="101" y="294" width="8" height="18" rx="3"/>
  </g>

  <!-- bicycle silhouette in the street -->
  <g transform="translate(190,290)" stroke="#1B2A4A" stroke-width="4" fill="none">
    <circle cx="0" cy="25" r="18"/>
    <circle cx="70" cy="25" r="18"/>
    <path d="M0 25 L35 -5 L70 25 M35 -5 L25 25 M35 -5 L48 -5" />
  </g>
  <circle cx="35" cy="278" r="7" fill="#C4471F"/>
</svg>
